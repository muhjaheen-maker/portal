h1,h2,h3,h4{font-weight:800;margin:0}
.top{background:var(--navy);color:#fff;padding:12px 20px;display:flex;align-items:center;gap:14px;border-bottom:4px solid var(--gold)}
.brand{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center}.brand img{height:50px;display:block}
.top .t{font-weight:800;font-size:18px}.top .s{opacity:.8;font-size:13px}
.top .sp{flex:1}.who{text-align:left;line-height:1.35}.who b{display:block;font-weight:700;font-size:14px}.who span{font-size:12.5px;opacity:.85}
.nav{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.nav .in{max-width:1240px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.nav a{padding:12px 16px;font-weight:700;color:var(--mute);text-decoration:none;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
.nav a.on{color:var(--navy);border-color:var(--gold)}.nav a:hover{color:var(--navy)}
.nav a .n{background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;margin-right:4px}
.wrap{max-width:1240px;margin:0 auto;padding:18px 16px 60px;position:relative}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.card h2{font-size:17px;color:var(--navy);margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card h2 .sp{flex:1}
.hello{display:flex;align-items:center;gap:14px;background:linear-gradient(90deg,#fff,var(--goldbg));}
.hello h1{font-size:20px;color:var(--navy)}.hello p{margin:2px 0 0;color:var(--mute);font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-top:3px solid var(--navy)}
.kpi.g{border-top-color:var(--gold)}.kpi.o{border-top-color:var(--ok)}.kpi.w{border-top-color:#e0a800}.kpi.r{border-top-color:var(--bad)}
.kpi b{display:block;font-size:26px;font-weight:800;color:var(--navy);line-height:1.2}.kpi span{font-size:13px;color:var(--mute);font-weight:500}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--label);color:#344054;text-align:right;padding:8px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
table.t td{padding:8px;border-bottom:1px solid #eef0f4;vertical-align:middle}
table.t tr:hover td{background:#fafbfd}
table.t tr.mh:hover td{background:#dbe8f8;color:var(--navy)}
.tw{overflow-x:auto}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap;background:#eef1f6;color:#344054}
.b-ok{background:var(--okbg);color:var(--ok)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-bad{background:var(--badbg);color:var(--bad)}.b-nav{background:var(--infobg);color:var(--navy)}.b-gold{background:var(--goldbg);color:#7a5c12}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--navy);color:#fff;display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px}
.btn:hover{background:var(--navy2)}.btn.g{background:var(--gold)}.btn.l{background:#fff;color:var(--navy);border:1px solid var(--line)}.btn.s{padding:4px 10px;font-size:13px}
.pipe{display:flex;flex-direction:column;gap:6px}
.pipe .r{display:grid;grid-template-columns:180px 1fr 34px;gap:8px;align-items:center;font-size:13.5px}
.pipe .bar{height:10px;background:#eef1f6;border-radius:6px;overflow:hidden}.pipe .bar i{display:block;height:100%;background:var(--navy);border-radius:6px}
.empty{color:var(--mute);text-align:center;padding:18px;font-size:14px}
.mute{color:var(--mute);font-size:13px}
.soon{text-align:center;padding:40px 16px}.soon h2{justify-content:center}.soon .ic{font-size:40px}
.alert{border-radius:8px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.a-bad{background:var(--badbg);color:var(--bad);border:1px solid #f3c0c0}.a-info{background:var(--infobg);color:var(--navy);border:1px solid #cdd9f0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9;max-width:90%}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:8;font-weight:800;color:var(--navy)}
@media(max-width:700px){.top{flex-wrap:wrap}.who{text-align:right}.pipe .r{grid-template-columns:130px 1fr 30px}}
@media print{.top,.nav,.no-print{display:none}body::before{display:none}}
 
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fi{from{opacity:0}to{opacity:1}}
.fx>*{animation:fu .42s cubic-bezier(.2,.7,.2,1) both}.fx>*:nth-child(2){animation-delay:.05s}.fx>*:nth-child(3){animation-delay:.1s}.fx>*:nth-child(4){animation-delay:.15s}.fx>*:nth-child(n+5){animation-delay:.2s}
.card,.kpi,.tile,.qcard,.mcard,.stat{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.card:hover,.qcard:hover,.mcard:hover{box-shadow:0 6px 20px rgba(31,56,100,.08)}
.kpi:hover,.stat:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(31,56,100,.10)}
.btn{transition:background .18s ease,transform .12s ease,box-shadow .18s ease}.btn:hover{box-shadow:0 4px 12px rgba(31,56,100,.18)}.btn:active{transform:scale(.97)}
table.t td{transition:background .15s ease}
.badge{transition:transform .15s ease}.badge:hover{transform:scale(1.04)}
input,select,textarea{transition:border-color .15s ease,box-shadow .15s ease}input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px rgba(44,74,124,.12)}
#toast{animation:fu .3s ease both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.nav a{transition:color .15s ease,border-color .2s ease,background .15s ease}.nav a:hover{background:#f6f8fc}
.mbtn{display:none;background:rgba(255,255,255,.14);border:0;color:#fff;font-size:22px;line-height:1;border-radius:10px;padding:8px 12px;cursor:pointer}
@media(max-width:760px){.top{padding:10px 12px;gap:10px;flex-wrap:nowrap}.top .t{font-size:15px}.top .s{display:none}.brand img{height:36px}.who{display:none}.mbtn{display:block;margin-right:auto}
 .nav .in{display:none;flex-direction:column;padding:6px 10px}.navopen .nav .in{display:flex;animation:fi .2s ease}.nav a{border-bottom:0;border-right:3px solid transparent;padding:10px 12px}.nav a.on{border-right-color:var(--gold);background:#f6f8fc}
 .wrap{padding:12px 10px 50px}.card{padding:12px;border-radius:10px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.kpi b{font-size:21px}
 table.t{font-size:13px}table.t th,table.t td{padding:6px}.card h2{font-size:16px;flex-wrap:wrap}.hello h1{font-size:18px}
 .fgrid,.fm,.ef,.mb,.qb,.dec,.ideas,.grid{grid-template-columns:1fr!important}.fgrid .w2,.ef .w2{grid-column:auto}.acts .btn,.acts2 .btn,.row2 .btn{flex:1;justify-content:center}
 .bar2 input,.bar3 input{min-width:0;width:100%}.vt,.mtabs{width:100%}.calnav h3{min-width:0;font-size:15px}.cal .d{min-height:64px;font-size:11px}.ev{font-size:10.5px}

    fld('to','وقت الانتهاء','<div id="f_to_w">'+tSel('f_to',x.to,dis)+'</div>',1)+
    fld('days','أيام الانعقاد الأسبوعية','<div class="wk" id="wk">'+WD.map(function(d,i){return '<button type="button" class="'+(x.days[i]?'on':'')+'" onclick="'+(ro?'':'tgl('+i+')')+'">'+d+'</button>'}).join('')+'</div>',1,'w2')+
    '</div><div class="calc" id="calcbox"></div></div>';
  
  h+='<div class="fsec"><h3>ثالثاً: الرسوم والتنفيذ</h3><div class="fgrid">'+
    fld('vtype','مكان الانعقاد','<select id="f_vtype" onchange="vtypeChg()"'+dis+'>'+opts(L.venues,x.vtype,'— اختر —')+'</select>',1)+
    fld('city','المدينة','<input id="f_city" value="'+esc(x.city)+'"'+dis+'>',1,'vx')+

    fld('minRun','الحد الأدنى لكل مرة انعقاد','<input id="f_minRun" type="number" min="1" value="'+esc(x.minRun||5)+'"'+dis+'><div class="mute" style="font-size:12px">تُلغى/تؤجَّل الدورة إن قلّ المسجلون عنه</div>',1,'rx')+
    fld('','إجمالي المشاركين خلال السلسلة','<input id="f_totSeats" readonly><div class="mute" style="font-size:12px" id="f_totH">= المقاعد × مرات الانعقاد بالشهر</div>',0,'rx')+

    fld('notes','ملاحظات','<textarea id="f_notes" rows="2"'+dis+'>'+esc(x.notes)+'</textarea>',0,'w2')+
    '</div><div id="mixbox" style="padding:0 14px 8px"></div><div class="mute" style="padding:0 14px 12px">يُفحص تعارض القاعة عند «حضوري بالمقر» (وللمدمج: أيامه الحضورية).</div></div>';
  
  h+='<div class="fsec"><h3>رابعاً: التسويق والعروض — العروض الخاصة وعروض المجموعات <small>اختياري — العرض الخاص لفئة محددة، وعرض المجموعات لعدد أدنى؛ يظهر للمتدرب ويُحسب الإجمالي تلقائيًا</small></h3><div style="padding:10px 14px"><div class="tw"><table class="t" id="offT"><tr><th>نوع العرض</th><th>الفئة صاحبة العرض / الحد الأدنى للمجموعة</th><th>اسم العرض</th><th>نوع الخصم</th><th>قيمة الخصم</th><th>من</th><th>إلى</th><th>مفعّل</th>'+(ro?'':'<th></th>')+'</tr>'+(x.group||[]).map(function(o){return offRow(o,ro)}).join('')+'</table></div><datalist id="offWho">'+(L.targets||[]).map(function(t){return '<option value="'+esc(t)+'">'}).join('')+'<option value="منسوبو جهة العمل المتعاقدة"><option value="الخريجون الجدد"></datalist>'+(ro?'':'<a class="btn s l" onclick="addOff()">+ عرض</a>')+'</div></div>';  
  h+='<div class="fsec"><h3>رابعاً (تابع): الرسالة التسويقية <small>تظهر جملةً افتتاحية في البيانات التسويقية ونص الإعلان — ولا تظهر في استمارة PIF</small></h3><div class="fgrid">'+
    fld('msg','الرسالة التسويقية','<textarea id="f_msg" rows="3" maxlength="1500" placeholder="مثال: ارتقِ بممارستك في جودة الرعاية الصحية واستعد لاختبار CPHQ بثقة مع نخبة من الخبراء."'+dis+'>'+esc(x.msg||'')+'</textarea>',0,'w2')+'</div></div>';
  if(x.flow&&x.flow.log&&x.flow.log.length)h+='<div class="fsec"><h3>سجل الدفعة</h3><ol class="logl" style="padding:10px 30px">'+x.flow.log.slice().reverse().slice(0,10).map(function(l){return '<li>'+esc(l[0])+' — '+esc(l[1])+(l[2]?' ('+esc(l[2])+')':'')+'</li>'}).join('')+'</ol></div>';
  h+='<div class="acts">'+(ro?(x.key&&E.me==='tm'?'<a class="btn g" onclick="openPif(\''+esc(x.key)+'\')">الاستمارة ←</a>':''):'<a class="btn" onclick="saveEntry(false)">حفظ</a><a class="btn g" onclick="saveEntry(true)">حفظ والتالي ← فريق التنفيذ</a>')+'<a class="btn l" onclick="entryList()">رجوع للقائمة</a></div>'+
    '<div class="mute" style="margin-top:6px">التالي: خامساً فريق تنفيذ البرنامج (فريق التدريب + المنسق الإداري) ← سادساً موازنة التدريب. لا يُرسل شيء لأحد في هذه المرحلة — تستكمل فريق التنفيذ والموازنة فيتولّد «PIF التنفيذي»، ثم يُرسل من «المراجعة والاعتماد».</div>';
  h+='</div>';
  $('app').innerHTML=h;window.scrollTo(0,0);
  FORM.ro=ro;showProg();vtypeChg();recChg();calc();
}
function offRow(o,ro){o=o||{};var D=ro?' disabled':'',sp=o.kind==='special';return '<tr data-off><td><select data-k="kind" onchange="offKind(this)"'+D+'><option value="group"'+(sp?'':' selected')+'>عرض مجموعات</option><option value="special"'+(sp?' selected':'')+'>عرض خاص</option></select></td>'+
  '<td><input data-k="min" type="number" min="2" value="'+esc(o.min||3)+'" placeholder="الحد الأدنى للمجموعة" style="display:'+(sp?'none':'')+'"'+D+'><input data-k="who" list="offWho" value="'+esc(o.who||'')+'" placeholder="الفئة صاحبة العرض (مثل: الطلاب، منسوبو جهة…)" style="display:'+(sp?'':'none')+'"'+D+'></td><td><input data-k="name" value="'+esc(o.name||'')+'" placeholder="مثال: عرض الجهات"'+D+'></td>'+
  '<td><select data-k="type"'+D+'><option value="pct"'+(o.type!=='sar'?' selected':'')+'>نسبة %</option><option value="sar"'+(o.type==='sar'?' selected':'')+'>مبلغ للمتدرب (ر.س)</option></select></td><td><input data-k="val" type="number" min="0" value="'+esc(o.val||'')+'"'+D+'></td>'+
  '<td><input data-k="from" type="date" value="'+esc(o.from||'')+'"'+D+'></td><td><input data-k="to" type="date" value="'+esc(o.to||'')+'"'+D+'></td><td style="text-align:center"><input data-k="active" type="checkbox"'+(o.active!==false?' checked':'')+D+'></td>'+(ro?'':'<td><button class="x" onclick="this.closest(\'tr\').remove()">×</button></td>')+'</tr>'}
function offKind(s){var r=s.closest('tr'),sp=s.value==='special';r.querySelector('[data-k=min]').style.display=sp?'none':'';r.querySelector('[data-k=who]').style.display=sp?'':'none'}
function addOff(){var t=$('offT'),d=document.createElement('tbody');d.innerHTML=offRow({},false);t.appendChild(d.firstChild)}
function offVals(){return [].slice.call(document.querySelectorAll('#offT tr[data-off]')).map(function(r){var o={};[].slice.call(r.querySelectorAll('[data-k]')).forEach(function(e){o[e.getAttribute('data-k')]=e.type==='checkbox'?e.checked:e.value.trim()});return o}).filter(function(o){return o.name&&o.val})}
function recChg(){var on=$('f_rec')&&$('f_rec').value==='1';if($('batchT'))$('batchT').textContent=on?'رقم السلسلة':'الدفعة';batchLbl();[].slice.call(document.querySelectorAll('.rx')).forEach(function(e){e.style.display=on?'':'none'});[].slice.call(document.querySelectorAll('.nrx')).forEach(function(e){e.style.display=on?'none':''});if(on&&$('f_sessions')&&!FORM.ro){$('f_sessions').value=1}mixBox();calc()}
 
function mixBox(){var b=$('mixbox');if(!b)return;var mx=$('f_vtype').value===E.lists.mixed,n=Number($('f_sessions').value)||0;if(!mx||!n){b.innerHTML='';return}
  var pl=FORM.dayPlan||[];b.innerHTML='<label class="f">البرنامج المدمج — نمط كل يوم <i>*</i></label><div class="wk">'+Array.apply(null,{length:n}).map(function(_,i){var c=pl[i]==='center';return '<span style="display:inline-flex;gap:4px;align-items:center;border:1px solid #cfd5df;border-radius:20px;padding:3px 10px;margin:2px">اليوم '+(i+1)+': <select data-dp="'+i+'" onchange="FORM.dayPlan['+i+']=this.value"'+(FORM.ro?' disabled':'')+'><option value="online"'+(c?'':' selected')+'>أونلاين</option><option value="center"'+(c?' selected':'')+'>حضوري بالمركز</option></select></span>'}).join('')+'</div><div class="mute">يُفحص تعارض القاعة على الأيام الحضورية فقط، وتُحسب الضيافة عليها.</div>';
  FORM.dayPlan=Array.apply(null,{length:n}).map(function(_,i){return pl[i]==='center'?'center':'online'})}function pickProg(){var p=progOf($('f_code').value);if(p&&!FORM.row){$('f_batch').value=E.lists.nextBatch[p.code]||1;var bm=p.base&&p.base.msg,mm=$('f_msg');if(bm&&mm&&!mm.value.trim())mm.value=bm}showProg()}
function showProg(){
  var code=FORM.row?FORM.code:$('f_code').value,p=progOf(code)||(FORM.row?{code:FORM.code,nameAr:FORM.nameAr,nameEn:FORM.nameEn,catName:FORM.category,acc:FORM.acc||[],sup:''}:null);
  if(FORM.row&&p&&!p.sup){var it=E.items.filter(function(i){return i.row===FORM.row})[0];if(it)p.sup=it.head}
  if(FORM.row&&p&&!p.mcode){var pc=progOf(FORM.code);if(pc)p.mcode=pc.mcode}
  $('progbox').innerHTML=p?fld('','الفئة','<input readonly value="'+esc(p.catName)+'">')+fld('','رمز الأرشيف','<input readonly dir="ltr" value="'+esc(p.code)+'">')+fld('','الرمز التسويقي','<input readonly dir="ltr" value="'+esc(p.mcode||'—')+'">')+
    fld('','اسم الدورة (عربي)','<input readonly value="'+esc(p.nameAr)+'">',0,'w2')+fld('','اسم الدورة (إنجليزي)','<input readonly dir="ltr" value="'+esc(p.nameEn)+'">',0,'w2')+
    fld('','الاعتماد','<input readonly value="'+esc((p.acc||[]).join('، '))+'">',0,'w2'):'';
  var bb=p&&(p.base||((progOf(p.code)||{}).base));
  $('headbox').innerHTML=!p?'<span class="mute">اختر البرنامج لتظهر بياناته من النموذج الأساسي.</span>':!bb?'<span style="color:var(--bad)">لا يوجد نموذج أساسي لهذا البرنامج — أنشئه من «بناء الخطة ← نموذج المعلومات PIF».</span>':
    '<span>من النموذج الأساسي '+esc(bb.id)+(bb.status!=='مكتمل'?' <b style="color:var(--bad)">(غير مكتمل)</b>':'')+':</span> <span>نمط التقديم المفضل: <b>'+esc((bb.modes||[]).map(function(m){return m.mode+(m.hours?' ('+m.hours+' س)':'')}).join('، ')||'—')+'</b></span> <span>المسؤول الإداري: <b>'+esc(bb.admin||'—')+'</b></span> <span>المنسق العلمي: <b>'+esc(bb.sciCoord||'—')+'</b></span> <span>اللغة: <b>'+esc(bb.lang||'—')+'</b></span>';
  batchLbl()}
function batchLbl(){var b=Number($('f_batch').value),r=$('f_rec')&&$('f_rec').value==='1';$('batchlbl').textContent=b>0?(r?'السلسلة ':'الدفعة ')+pad(b):''}
function vtypeChg(){mixBox();var out=$('f_vtype').value==='حضوري خارج المقر';[].slice.call(document.querySelectorAll('.vx')).forEach(function(e){e.style.display=out?'':'none'})}
function seatsCalc(){var t=$('f_totSeats');if(!t)return;var s=Number(($('f_seats')||{}).value)||0,n=FORM.occN||0;t.value=s&&n?(s*n)+' مشارك':'—';$('f_totH').textContent=s&&n?'= '+s+' مقاعد × '+n+' مرات انعقاد بالشهر':'= المقاعد × مرات الانعقاد بالشهر (اختر الموعد والأيام)'}
function tgl(i){FORM.days[i]=!FORM.days[i];var b=$('wk').children[i];b.className=FORM.days[i]?'on':'';calc()}
function calc(){
  var y=Number($('f_year').value),mi=MONTHS_AR.indexOf($('f_month').value),dsel=$('f_day'),cur=dsel.value||String(FORM.day||'');
  var dim=(y&&mi>-1)?new Date(y,mi+1,0).getDate():31,o='<option value="">—</option>';
  for(var i=1;i<=dim;i++)o+='<option'+(String(i)===cur?' selected':'')+'>'+i+'</option>';
  dsel.innerHTML=o;
  var box=[],d=Number(dsel.value),ses=Number($('f_sessions').value),fr=hm(tVal('f_from')),to=hm(tVal('f_to'));
  var any=FORM.days.some(function(b){return b});FORM.occN=0;
  if(y&&mi>-1&&d){
    var st=new Date(y,mi,d),k=0;
    if(any){while(!FORM.days[st.getDay()]&&k<7){st.setDate(st.getDate()+1);k++}}
    box.push('<div class="cbox"><span>تاريخ البدء الفعلي</span><b>'+WD[st.getDay()]+' '+fmtD(st)+'</b>'+(k?'<span>عُدِّل من '+d+' لأنه أول يوم انعقاد</span>':'')+'</div>');
    var isRec=$('f_rec')&&$('f_rec').value==='1';
    if(isRec&&any){var dd=new Date(st),mm=st.getMonth(),L=[];while(dd.getMonth()===mm){if(FORM.days[dd.getDay()])L.push(WD[dd.getDay()]+' '+fmtD(dd));dd.setDate(dd.getDate()+1)}FORM.occN=L.length;box.push('<div class="cbox full"><span>مرات الانعقاد بالشهر: <b style="font-size:14px">'+L.length+' مرات</b> — كل مرة دورة مستقلة بيوم واحد</span><div class="occ">'+L.map(function(t,i){return '<span><i>'+(i+1)+'</i>'+t+'</span>'}).join('')+'</div></div>');seatsCalc()}
    else if(any&&ses>0){var en=new Date(st),c=1;while(c<ses){en.setDate(en.getDate()+1);if(FORM.days[en.getDay()])c++}
      box.push('<div class="cbox"><span>تاريخ الانتهاء</span><b>'+WD[en.getDay()]+' '+fmtD(en)+'</b></div>')}
    var dl=Math.ceil((st-new Date().setHours(0,0,0,0))/864e5);
    if(dl<60)box.push('<div class="cbox bad"><span>المدة حتى البدء</span><b>'+dl+' يوم</b><span>السياسة: الإدخال قبل 60 يومًا على الأقل</span></div>');
  } else box.push('<div class="cbox"><span>تاريخ البدء الفعلي</span><b>—</b><span>اختر السنة والشهر واليوم</span></div>');
  if(fr!=null&&to!=null){var hh=to-fr;
    box.push('<div class="cbox'+(hh>0?'':' bad')+'"><span>مدة اليوم التدريبي</span><b>'+(hh>0?hh+' ساعة':'الانتهاء قبل البدء')+'</b></div>');
    if(hh>0&&ses>0)box.push('<div class="cbox"><span>إجمالي الساعات</span><b>'+Math.round(hh*ses*10)/10+' ساعة</b></div>')}
  $('calcbox').innerHTML=box.join('');seatsCalc();
}
function collect(){
  function v(id){var e=$('f_'+id);return e?e.value.trim():''}
  return {code:FORM.row?FORM.code:v('code'),batch:v('batch'),fee:v('fee'),year:v('year'),month:v('month'),day:v('day'),
    sessions:v('sessions'),from:tVal('f_from'),to:tVal('f_to'),vtype:v('vtype'),city:v('city'),site:v('site'),notes:v('notes'),participants:v('rec')==='1'?v('seats'):v('participants'),ce:v('ce'),msg:($('f_msg')||{}).value||'',rec:v('rec')==='1',target:'',seats:v('seats'),minRun:v('minRun'),dayPlan:(FORM.dayPlan||[]).slice(),offers:offVals(),days:FORM.days.slice()};
}
function localErrs(x){
  var e=[],req={code:'البرنامج',batch:'رقم الدفعة',fee:'الرسوم المقترحة',year:'السنة',month:'الشهر',day:'اليوم',sessions:'عدد أيام الدورة',vtype:'مكان الانعقاد'};
  if(x.vtype==='حضوري خارج المقر'){req.city='المدينة';req.site='موقع التدريب'}
  Object.keys(req).forEach(function(k){var el=$('f_'+k);var bad=!x[k];if(el)el.className=bad?'bad':'';if(bad)e.push(req[k])});
  if(!x.from)e.push('وقت البدء');if(!x.to)e.push('وقت الانتهاء');
  if(x.from&&x.to&&!(hm(x.to)>hm(x.from)))e.push('وقت الانتهاء بعد البدء');
  if(!x.days.some(function(b){return b}))e.push('أيام الانعقاد الأسبوعية');
  return e;
}
function saveEntry(submit){
  var x=collect(),e=localErrs(x);
  if(!x.code){$('errs').innerHTML='<div class="errs">اختر البرنامج أولاً.</div>';window.scrollTo(0,0);return}
  if(submit&&e.length){$('errs').innerHTML='<div class="errs"><b>أكمل قبل الانتقال للجزء (أ):</b> '+esc(e.join('، '))+'</div>';window.scrollTo(0,0);return}
  busy(true);
  run('api_entrySave',[BOOT.k,FORM.row,x,false]).then(function(r){busy(false);
    toast('تم الحفظ ✔ '+(r.errors.length?'(ناقص: '+r.errors.join('، ')+')':''));
    if(submit){openPif(r.key);return}   
    run('api_entryList',[BOOT.k]).then(function(d){E=d;entryForm(r.row)});
  }).catch(function(err){busy(false);toast(err.message)});
}
</script>

.qp span{display:block;font-size:12px;color:var(--mute)}.qp b{color:var(--navy);font-size:15px}.qp div[dir=ltr]{text-align:left}

.budk{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:10px}.budk .bk b{white-space:nowrap}.qd .qb .qi b{white-space:nowrap}.qd .qb{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.qd .qi.full{grid-column:1/-1}.budk .bk{background:var(--goldbg);border:1px solid #ecdcae;border-radius:10px;padding:6px 10px}.budk .bk span{display:block;font-size:12px;color:#6b5a2a}.budk .bk b{color:var(--navy)}.budk .bk.ok{background:var(--okbg);border-color:#b9e2c9}.budk .bk.bad{background:var(--badbg);border-color:#f3c0c0}

</style>
<script>
var A = null;
function approvals(){
  busy(true);
  run('api_apprList',[BOOT.k]).then(function(d){busy(false);A=d;renderAppr()}).catch(function(e){busy(false);fatal(e.message)});
}
function qi(l,v){return '<div class="qi"><span>'+esc(l)+'</span><b>'+(v===''||v==null?'—':esc(v))+'</b></div>'}
function money(v){return v===''||v==null?'—':Number(v).toLocaleString('en')+' ر.س'}
function qhead(x){
  return '<div class="qh"><div><h3>'+esc(x.nameAr)+'</h3><div class="mute">'+esc(bk(x.key))+(x.nameEn?' · '+esc(x.nameEn):'')+'</div></div><span class="sp"></span>'+badge(x.stage)+' '+days(x.daysLeft)+'</div>';
}
function qprog(x){return '<div class="qp"><div><span>اسم البرنامج (عربي)</span><b>'+esc(x.nameAr)+'</b></div><div dir="ltr"><span>Program name (English)</span><b>'+esc(x.nameEn||'—')+'</b></div><div><span>رمز الأرشيف / الدفعة</span><b dir="ltr">'+esc(x.key)+'</b></div><div><span>الرمز التسويقي</span><b dir="ltr">'+esc(x.mcode||'—')+'</b></div><div><span>المسار / الفئة</span><b>'+esc(x.category||x.council)+'</b></div></div>'}
function qbody(x){
  return qprog(x)+'<div class="qb">'+qi('تاريخ البدء',x.start)+qi('تاريخ الانتهاء',x.end)+
    qi('أيام الانعقاد',(x.days||[]).join('، '))+qi('الوقت',x.from&&x.to?x.from+' – '+x.to:'')+qi('عدد الأيام / الساعات',(x.sessions||'—')+' يوم · '+(x.totalHours||0)+' ساعة')+
    qi('المنصة / المقر',x.venue)+qi('الرسوم المقترحة',money(x.fee))+(x.ce?qi('ساعات CE/CNE',x.ce):'')+(x.participants?qi('المشاركون المتوقعون',x.participants):'')+
    (x.notes?qi('ملاحظات إدارة التدريب',x.notes):'')+'</div>';
}
 
function qBud(x){var b=x.budget,c=x.budCalc;if(!b||!c)return '<div class="ask" style="background:var(--badbg);color:var(--bad)">لم تُحفظ الموازنة بعد.</div>';
  return '<details class="qd" open><summary>موازنة البرنامج التدريبي — '+esc(b.mode)+'</summary><div class="qb">'+qi('الإيراد المتوقع',money(c.revenue)+' ('+c.trainees+' متدرب × '+money(c.fee)+')')+
    qi('أتعاب المحاضر',(b.lecBasis==='trainee'?c.trainees+' متدرب':(b.lecQty||0)+(b.lecBasis==='day'?' يوم':' ساعة'))+' × '+money(b.lecRate)+' = '+money(c.lec))+qi('مستلزمات التدريب',money(b.supplies)+' للمتدرب')+qi('مخصص التسويق المبدئي',money(b.mkt))+
    (b.mode!=='عن بعد'?qi('الضيافة',c.trainees+' متدرب × '+money(b.hosp)+' × '+(b.breaks||1)+' استراحة يوميًا × '+(b.hospDays||0)+' يوم'):'')+qi('المصروفات الثابتة',money(b.fixed))+qi('الاعتمادات المستهدفة',money(b.accr))+
    (b.other||[]).map(function(o){return qi('أخرى: '+o.t,money(o.v))}).join('')+'</div>'+(b.notes?'<div class="mute" style="padding:0 14px 10px">'+esc(b.notes)+'</div>':'')+'</details>'}
function renderAppr(){
  var me=A.me,h='';
  if(me==='sci'){h+='<div id="sciPif"></div>'+sciView()}else h+=gmView();
  h+=doneView();
  $('app').innerHTML=h;
  if(me==='sci')run('api_sciPifs',[BOOT.k]).then(function(d){SCI=d;var pe=d.items.filter(function(x){return x.pending});var el=$('sciPif');if(el&&pe.length)el.innerHTML='<div class="card" style="border-color:var(--gold)"><h2>مراجعات علمية مطلوبة لاستمارات PIF<span class="sp"></span><span class="badge b-warn">'+pe.length+'</span></h2>'+pe.map(function(x){return '<div class="row2" style="justify-content:space-between;border-top:1px solid #eef0f4;padding-top:8px"><span><b>'+esc(x.course)+'</b> <span class="mute">— بطلب '+esc(x.req?x.req.from:'')+'</span></span><a class="btn s g" onclick="sciEnd(\''+esc(x.key)+'\')">مراجعة</a></div>'}).join('')+'</div>'}).catch(function(){});
}

 
function doneView(){var h='';
  if(A.me!=='sci'&&A.done.length)h+='<div class="card"><h2>اعتمادات تمت أو رُفضت<span class="sp"></span><span class="badge">'+A.done.length+'</span></h2><div class="tw"><table class="t"><tr><th>البرنامج</th><th>المصادقة العلمية</th><th>قرار المدير العام</th><th>المرحلة الآن</th></tr>'+
    A.done.map(function(x){var f=x.flowFull||{};return '<tr><td><b>'+esc(x.nameAr)+'</b><div class="mute">'+esc(x.key)+'</div></td><td>'+esc(f.sciDec||'—')+(f.sciBy?'<div class="mute">'+esc(f.sciBy)+' — '+esc(f.sciAt||'')+'</div>':'')+'</td><td>'+esc(x.planStatus||'—')+(f.gmNote?'<div class="mute">'+esc(f.gmNote)+'</div>':'')+'</td><td>'+badge(x.stage)+'</td></tr>'}).join('')+'</table></div></div>';
  if(A.pifs&&A.pifs.length)h+='<div class="card"><h2>استمارات PIF<span class="sp"></span><span class="badge">'+A.pifs.length+'</span></h2><div class="tw"><table class="t"><tr><th>البرنامج</th><th>الاستمارة</th><th>الحالة</th></tr>'+
    A.pifs.map(function(x){var L={'مسودة لدى المشرف':'مسودة لدى إدارة التدريب','قيد مراجعة المشرف':'قيد تحقق إدارة التدريب','بانتظار اعتماد المدير':'بانتظار اعتماد المدير العام'};return '<tr><td><b>'+esc(x.nameAr)+'</b><div class="mute">'+esc(x.key)+'</div></td><td>'+esc(x.id)+'</td><td><span class="badge">'+esc(L[x.status]||x.status)+'</span></td></tr>'}).join('')+'</table></div></div>';
  return h}
 
function sciView(){
  var h='<div class="card"><h2>المصادقة العلمية<span class="sp"></span><span class="badge '+(A.queue.length?'b-warn':'b-ok')+'">'+A.queue.length+' بانتظارك</span></h2>'+
    '<p class="mute" style="margin:0">بعد مصادقتك يُرفع البرنامج إلى المدير العام لاعتماد الرسوم والتاريخ (التسكين).</p></div>';
  if(!A.queue.length)h+='<div class="card empty">لا توجد برامج بانتظار مصادقتك ✔</div>';
  A.queue.forEach(function(x){
    h+='<div class="qcard">'+qhead(x)+qbody(x)+'<div class="ask">راجع ملاءمة البرنامج علميًا من حيث: <b>الاسم الصحيح وترجمته</b>، و<b>فئة البرنامج</b>، و<b>الساعات</b>، و<b>التاريخ والأيام</b>، وأبدِ ملاحظاتك إن وُجدت للرفع إلى المدير العام.</div>'+
      '<div class="qa"><label class="f" style="font-weight:700;font-size:13px">ملاحظات المجلس العلمي (للمدير العام — إلزامية عند الإعادة)</label><textarea id="sn'+x.row+'" placeholder="ملاحظاتك أو توصياتك العلمية…"></textarea>'+
      '<div class="row2"><a class="btn ok" onclick="sciDo('+x.row+',\'ok\')">✓ مصادقة علمية</a><a class="btn r" onclick="sciDo('+x.row+',\'ret\')">↩ إعادة لإدارة التدريب</a></div></div></div>';
  });
  if(A.others.length){
    h+='<div class="card"><h2>قراراتك السابقة</h2><div class="tw"><table class="t"><tr><th>البرنامج</th><th>القرار</th><th>التاريخ</th><th>المرحلة الآن</th></tr>'+
      A.others.map(function(x){var f=x.flowFull||{};return '<tr><td><b>'+esc(x.nameAr)+'</b><div class="mute">'+esc(bk(x.key))+'</div></td><td>'+esc(f.sciDec||'—')+(f.sciNote?'<div class="mute">'+esc(f.sciNote)+'</div>':'')+'</td><td>'+esc(f.sciAt||'')+'</td><td>'+badge(x.stage)+'</td></tr>'}).join('')+'</table></div></div>';
  }
  return h;
}
function sciDo(row,dec){
  var note=($('sn'+row)||{}).value||'';
  if(dec==='ret'&&!note.trim()){toast('اكتب ملاحظة توضّح سبب الإعادة');$('sn'+row).focus();return}
  if(!confirm(dec==='ok'?'تأكيد المصادقة العلمية ورفع البرنامج للمدير العام؟':'إعادة البرنامج لإدارة التدريب بالملاحظة؟'))return;
  busy(true);
  run('api_sciDecide',[BOOT.k,row,dec,note]).then(function(r){busy(false);toast(r.msg);approvals()}).catch(function(e){busy(false);toast(e.message)});
}

 
function gmView(){
  var h='<div class="card"><h2>اعتماد البرامج<span class="sp"></span><span class="badge '+(A.queue.length?'b-warn':'b-ok')+'">'+A.queue.length+' بانتظارك</span></h2>'+
    '<p class="mute" style="margin:0">كل برنامج في صفحة واحدة: (1) المصروفات — رسوم البرنامج وأتعاب المحاضر ومخصص التسويق، لكل بند: موافق / تعديل / رفض، وأي تعديل يُحدِّث الموازنة فورًا؛ (2) الموازنة كاملة — موافق / رفض؛ (3) الاعتماد النهائي للـ PIF. الرفض أو الإعادة يتطلبان ملاحظة ويعيدان البرنامج لإدارة التدريب.</p></div>';
  if(!A.queue.length)h+='<div class="card empty">لا توجد برامج بانتظار اعتمادك ✔</div>';
  A.queue.forEach(function(x){
    var f=x.flowFull||{},r=x.row,b=x.budget||{};
    h+='<div class="qcard">'+qhead(x)+qbody(x)+
      (f.sciDec==='مصادقة'?'<div class="sci">✓ صادق عليه <b>'+esc(f.sciBy)+'</b> — '+esc(f.sciAt)+(f.sciNote?' · '+esc(f.sciNote):'')+'</div>':'')+
      '<div class="qa">'+
      '<div class="gpart"><h4><b>1</b> المصروفات</h4><div class="dec">'+
        k3box(r,'fee','رسوم البرنامج المقترحة (للمتدرب)',x.fee)+k3box(r,'lecRate','أتعاب المحاضر ('+lecU(b)+')',b.lecRate)+k3box(r,'mkt','مخصص التسويق',b.mkt)+'</div>'+
        '<div class="mute" style="font-size:12.5px">أي تعديل هنا يُحدِّث الموازنة في (2) فورًا.</div></div>'+
      '<div class="gpart"><h4><b>2</b> الموازنة كاملة</h4>'+(x.budget?'<div id="gbs'+r+'"></div><div class="seg" style="margin-top:10px">'+seg(r,'bud','ok','موافق')+seg(r,'bud','no','رفض','no')+'</div>':'<div class="ask" style="background:var(--badbg);color:var(--bad)">لم تُحفظ الموازنة.</div>')+'</div>'+
      '<div class="gpart"><h4><b>3</b> الاعتماد النهائي للـ PIF</h4>'+(x.partA?'<details class="qd" ontoggle="if(this.open)gmPif('+r+',\''+esc(x.partA.pifId)+'\')"><summary>فتح الاستمارة '+esc(x.partA.pifId)+' في هذه الصفحة</summary><iframe id="gpf'+r+'" style="width:100%;height:75vh;border:0;background:#fff;border-top:1px solid var(--line)"></iframe></details>':'<div class="ask" style="background:var(--badbg);color:var(--bad)">لا توجد استمارة.</div>')+
      '<textarea id="gn'+r+'" style="margin-top:10px" placeholder="ملاحظة أو توصية (إلزامية عند الرفض أو الإعادة)"></textarea>'+
      '<div class="row2"><a class="btn ok" id="gok'+r+'" onclick="gmDo('+r+',\'approve\')">✓ الاعتماد النهائي</a><a class="btn l" onclick="gmDo('+r+',\'return\')">↩ إعادة لإدارة التدريب</a></div></div></div></div>';
  });
  setTimeout(function(){A.queue.forEach(function(x){gBud(x.row);gReady(x.row)})},0);
  return h;
}
function lecU(b){b=b||{};return b.lecBasis==='trainee'?'للمتدرب':b.lecBasis==='day'?'لليوم':'للساعة'}
function k3box(r,k,l,v){return '<div class="dbox"><h4>'+esc(l)+'</h4><div style="font-size:15px;font-weight:800;color:var(--navy);margin-bottom:6px">'+money(v)+'</div><div class="seg">'+seg(r,k,'ok','موافق')+seg(r,k,'edit','تعديل','ed')+seg(r,k,'no','رفض','no')+'</div>'+
  '<input type="number" min="0" step="any" id="k3'+k+r+'" value="'+esc(v===''||v==null?'':v)+'" style="display:none" placeholder="القيمة الجديدة (ر.س)" oninput="gBud('+r+')"></div>'}
function gmPif(r,id){var f=$('gpf'+r);if(!f||f.getAttribute('data-l'))return;f.setAttribute('data-l','1');f.srcdoc='<p style="font-family:Tahoma;padding:20px;color:#667">جارٍ تحميل الاستمارة…</p>';
  run('api_view',['mgr',BOOT.k,id,false]).then(function(h){f.srcdoc=h}).catch(function(e){f.srcdoc='<p style="font-family:Tahoma;padding:20px;color:#a12020">'+esc(e.message)+'</p>'})}
 
function k3val(r){var x=A.queue.filter(function(i){return i.row===r})[0]||{},b=JSON.parse(JSON.stringify(x.budget||{})),g=GD[r]||{};
  function v(k,d){var e=$('k3'+k+r);return g[k]==='edit'&&e&&e.value!==''?Math.max(0,Number(e.value)||0):d}
  var fee=v('fee',Number(x.fee)||0);b.lecRate=v('lecRate',Number(b.lecRate)||0);b.mkt=v('mkt',Number(b.mkt)||0);b.other=b.other||[];return {fee:fee,b:b,x:x}}
 
function gBud(r){var el=$('gbs'+r);if(!el)return;var q=k3val(r),b=q.b,b0=q.x.budget||{},fee=q.fee,rem=b.mode==='عن بعد',n=Number(b.trainees)||0,N=Number(b.occ)||1;
  var perT=b.lecBasis==='trainee',qty=perT?n:(Number(b.lecQty)||0),lec=qty*b.lecRate,hpp=rem?0:(Number(b.hosp)||0)*(Number(b.breaks)||1)*(Number(b.hospDays)||0),sup=Number(b.supplies)||0,
    oth=b.other.reduce(function(s,o){return s+(Number(o.v)||0)},0),fixed=(perT?0:lec)+b.mkt+(Number(b.fixed)||0)+(Number(b.accr)||0)+oth,varPer=sup+hpp+(perT?b.lecRate:0),cost=fixed+varPer*n,rev=fee*n,net=rev-cost,be=fee>varPer?Math.ceil(fixed/(fee-varPer)):null;
  var cf=fee!==(Number(q.x.fee)||0),cl=b.lecRate!==(Number(b0.lecRate)||0),cm=b.mkt!==(Number(b0.mkt)||0);
  function R(l,basis,v,ch,old){return '<tr'+(ch?' style="background:#fff6e0"':'')+'><td>'+l+(ch?' <span class="badge b-gold">معدّل</span>':'')+'</td><td class="mute">'+basis+'</td><td style="white-space:nowrap;text-align:left">'+(ch&&old!=null?'<s class="mute">'+old+'</s> ':'')+'<b>'+v+'</b></td></tr>'}
  var n0=Number(q.x.fee)||0,l0=Number(b0.lecRate)||0;
  var h='<div class="tw"><table class="t gbt"><tr><th>البند</th><th>الأساس</th><th style="text-align:left">المبلغ</th></tr>'+
    '<tr><td colspan="3" style="background:#eef3fb;font-weight:800;color:var(--navy)">الإيراد — '+esc(b.mode||'')+(N>1?' (لكل مرة انعقاد)':'')+'</td></tr>'+
    R('الإيراد المتوقع',n+' متدرب × '+money(fee)+(cf?' (كانت '+money(n0)+')':''),money(rev),cf,money(n0*n))+
    '<tr><td colspan="3" style="background:#eef3fb;font-weight:800;color:var(--navy)">التكاليف</td></tr>'+
    R('أتعاب المحاضر',qty+(perT?' متدرب':b.lecBasis==='day'?' يوم':' ساعة')+' × '+money(b.lecRate)+(cl?' (كانت '+money(l0)+')':''),money(lec),cl,money(qty*l0))+
    R('مستلزمات التدريب',n+' متدرب × '+money(sup),money(sup*n))+
    (rem?'':R('الضيافة',n+' متدرب × '+money(b.hosp||0)+' × '+(b.breaks||1)+' استراحة × '+(b.hospDays||0)+' يوم',money(hpp*n)))+
    R('مخصص التسويق','مبلغ مقطوع',money(b.mkt),cm,money(Number(b0.mkt)||0))+R('المصروفات الثابتة','القاعة / المنصة / التشغيل',money(b.fixed||0))+R('الاعتمادات المستهدفة','مبلغ مقطوع',money(b.accr||0))+
    b.other.map(function(o){return R('أخرى: '+esc(o.t),'مبلغ مقطوع',money(o.v||0))}).join('')+
    R('<b>إجمالي التكاليف</b>','ثابتة '+money(fixed)+' + متغيرة '+money(varPer*n),money(cost))+
    '<tr style="background:'+(net<0?'var(--badbg)':'var(--okbg)')+'"><td><b>صافي العائد</b></td><td class="mute">هامش '+(rev?Math.round(net/rev*1000)/10:0)+'%</td><td style="white-space:nowrap;text-align:left"><b>'+money(net)+'</b></td></tr>'+
    R('نقطة التعادل','الحد الأدنى لتغطية التكاليف',be?be+' متدرب':'الرسوم لا تغطي التكلفة المتغيرة')+R('تكلفة المتدرب','',money(n?Math.round(cost/n*100)/100:0))+

function seg(r,k,v,l,c){return '<label class="'+(c||'')+'" id="sg_'+k+'_'+v+'_'+r+'" onclick="pick('+r+',\''+k+'\',\''+v+'\')">'+l+'</label>'}
var GD={};
function pick(r,k,v){
  GD[r]=GD[r]||{};GD[r][k]=v;
  ['ok','edit','no'].forEach(function(x){var el=$('sg_'+k+'_'+x+'_'+r);if(el)el.className=el.className.replace(/\s*on/g,'')+(x===v?' on':'')});
  var e=$('k3'+k+r);if(e)e.style.display=v==='edit'?'block':'none';

function gReady(r){var g=GD[r]||{},miss=['fee','lecRate','mkt','bud'].filter(function(k){return !g[k]}),b=$('gok'+r);if(!b)return;b.style.opacity=miss.length?'.45':'';b.title=miss.length?'اتخذ القرار في (1) و(2) أولاً':''}
function gmDo(r,action){
  var g=GD[r]||{},note=(($('gn'+r)||{}).value||'').trim(),q=k3val(r),x=q.x,b0=x.budget||{},L={fee:'رسوم البرنامج',lecRate:'أتعاب المحاضر',mkt:'مخصص التسويق',bud:'الموازنة'};
  var rej=['fee','lecRate','mkt','bud'].filter(function(k){return g[k]==='no'});

  if(action==='approve'&&rej.length)action='return';

  var feeCh=q.fee!==(Number(x.fee)||0),budCh=q.b.lecRate!==(Number(b0.lecRate)||0)||q.b.mkt!==(Number(b0.mkt)||0);

  var msg=action==='return'?(rej.length?'رفض ('+rej.map(function(k){return L[k]}).join('، ')+') وإعادة البرنامج لإدارة التدريب؟':'إعادة البرنامج لإدارة التدريب؟'):'الاعتماد النهائي للبرنامج (المصروفات والموازنة والاستمارة)'+(feeCh||budCh?' بالتعديلات':'')+'؟';

    $('app').innerHTML=h;

  }).catch(function(e){busy(false);fatal(e.message)});

function saveProg(isNew,oldCode){var p={cat:$('p_cat').value,code:$('p_code').value,mcode:$('p_mcode').value,nameAr:$('p_ar').value,nameEn:$('p_en').value,active:$('p_act').value==='1',oldCode:oldCode,
  acc:[].slice.call($('p_acc').querySelectorAll('input:checked')).map(function(x){return x.value})};
  busy(true);run('api_progSave',[BOOT.k,p,isNew]).then(function(d){busy(false);CT=d;toast('حُفظ البرنامج ✔');renderProgs()}).catch(function(e){busy(false);toast(e.message)})}
</script>
<style>
.bcat{border-right:4px solid var(--gold)}.bch{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}.bch h3{color:var(--navy);font-size:16px}.bch .sp{flex:1}
.bpct{display:flex;align-items:center;gap:8px;min-width:220px}.bpct .rbar{flex:1;height:9px;background:#eef1f6;border-radius:6px;overflow:hidden}.bpct .rbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--navy))}
.qp2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 14px;padding:10px 12px;background:var(--infobg,#e8eef9);border:1px solid #cdd9f0;border-radius:10px}.qp2 span{display:block;font-size:12px;color:var(--mute)}.qp2 b{color:var(--navy)}
.chips3{display:grid!important;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px!important}.chips3 label{display:flex!important;align-items:center;gap:8px;border-radius:8px!important;padding:7px 10px!important;margin:0!important;width:auto!important;line-height:1.5;text-align:right}.chips3 label input[type=checkbox]{width:auto!important;flex:none;margin:0;min-height:0}.chips3 label .x{margin-inline-start:auto;color:#a33;cursor:pointer;font-weight:700;padding:0 4px}.addrow{display:flex;gap:6px;margin-top:8px;max-width:460px}.addrow input{flex:1;font:inherit;font-size:14px;padding:7px 10px;border:1px solid #cfd5df;border-radius:8px}
.fsec textarea{width:100%;box-sizing:border-box;min-height:96px;font:inherit;font-size:14px;padding:8px 10px;border:1px solid #cfd5df;border-radius:8px;resize:vertical;line-height:1.7}
.bmodes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-top:6px}.bmode{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff}.bmode.on{border-color:var(--gold);background:var(--goldbg)}.bmode label{font-weight:700;display:flex;gap:6px;align-items:center;cursor:pointer}.bmode input[type=number]{margin-top:6px;width:100%;font:inherit;padding:6px 8px;border:1px solid #cfd5df;border-radius:8px}
.blist .bit{display:flex;gap:6px;margin-bottom:6px}.blist .bit input{flex:1;font:inherit;font-size:14px;padding:7px 10px;border:1px solid #cfd5df;border-radius:8px}
.bunit{border:1px solid #d6dde9;border-right:4px solid var(--navy);border-radius:10px;padding:10px;margin-bottom:10px;background:#fff}.bug{display:grid;grid-template-columns:minmax(180px,30%) 1fr;gap:10px}@media(max-width:760px){.bug{grid-template-columns:1fr}}
.bunit input,.bunit textarea{width:100%;font:inherit;font-size:14px;padding:7px 10px;border:1px solid #cfd5df;border-radius:8px}
.lead3{margin:12px 0 4px;padding:8px 12px;background:var(--label);border-right:4px solid var(--gold);border-radius:8px;font-weight:800;color:var(--navy)}.sh3{margin-top:12px!important;color:var(--navy)!important}
</style>
<script>
var BAUD=['أطباء استشاريون','أطباء أخصائيون','أطباء مقيمون وعموم','أطباء أسنان','صيادلة','تمريض','أخصائيو المختبرات','أخصائيو الأشعة','العلاج الطبيعي والتأهيل','التغذية العلاجية','فنيو الطوارئ والإسعاف','أخصائيو الجودة وسلامة المرضى','ممارسو مكافحة العدوى','الإدارة الصحية والتشغيل','السجلات والمعلومات الصحية','الصحة العامة','طلاب العلوم الصحية والامتياز','أخرى'];
var BDEG=['أستاذ دكتور (بروفيسور)','أستاذ مشارك','أستاذ مساعد','دكتوراه (دكتور)','ماجستير','مدرس مساعد / معيد','دبلوم عالٍ','بكالوريوس','دبلوم','لا يُشترط'];
var BSPEC=['صحي (طبي)','تمريضي','صيدلي','طب الأسنان','مختبرات وأشعة','علاج طبيعي وتأهيل','صحة عامة','جودة وسلامة المرضى','إداري','قانوني','مالي ومحاسبي','تقني / معلوماتية صحية','تعليمي / تربوي','هندسي','أخرى'];
var BYEARS=['لا يُشترط','سنة على الأقل','سنتان على الأقل','3 سنوات على الأقل','5 سنوات على الأقل','7 سنوات على الأقل','10 سنوات على الأقل','15 سنة على الأقل'];
var BLANGS=['العربية','الإنجليزية','العربية والإنجليزية'];
var BCREDS=['ترخيص مهني ساري من الهيئة السعودية للتخصصات الصحية','تصنيف مهني ساري (أخصائي / استشاري)','شهادة إعداد مدربين (TOT)','مدرب معتمد للبرنامج (Instructor) من جهة الاعتماد','شهادة البرنامج نفسه سارية (مثل BLS / ACLS)','زمالة أو بورد في التخصص','شهادة مهنية في المجال (مثل CPHQ / CIC / PMP)','خبرة سابقة في تقديم البرنامج نفسه','عضوية جمعية مهنية متخصصة','أخرى'];
var BTOOLS=['جهاز عرض (Projector) وشاشة','حاسب محمول للمدرب','سبورة ذكية أو ورقية (Flip Chart)','نظام صوت ومايكروفون','اتصال إنترنت مستقر','منصة افتراضية (بيان / Zoom)','مجسّمات محاكاة (Manikins)','جهاز مزيل الرجفان التدريبي (AED Trainer)','أدوات ومستلزمات طبية للتطبيق العملي','قاعة مجهّزة لورش العمل','طابعة وأوراق عمل','متطلبات أخرى'];
var BMATS=['دليل المتدرب','دليل المدرب','العرض التقديمي (PowerPoint)','أوراق العمل والتمارين','دراسات الحالة','الاختبار القبلي والبعدي','قوائم التحقق للتقييم العملي (Checklists)','مقاطع فيديو تعليمية','المراجع والقراءات المساندة','استبيان تقييم البرنامج','مواد أخرى'];
var BEVAL=['تقييم قبلي وبعدي (Pre & Post Test)','تقييم مهاري / عملي (Skills Assessment) وفق قائمة تحقق','مشاريع عملية وتطبيقات','نسبة الحضور والمشاركة','استبيان رضا المتدربين عن البرنامج والمدرب'];
 
var BQ=null,BD=null;
function bpif(){busy(true);run('api_baseList',[BOOT.k]).then(function(d){busy(false);BQ=d;bpList()}).catch(function(e){busy(false);fatal(e.message)})}
function bsBadge(b){if(!b)return '<span class="badge">لم يُنشأ</span>';return '<span class="badge '+(b.status==='مكتمل'?'b-ok':'b-warn')+'">'+esc(b.status)+'</span>'}
function bpList(){var d=BQ,tm=d.me==='tm';
 var h='<div class="card"><h2>نموذج المعلومات PIF — الأساسي لبرامج الخطة</h2><p class="mute" style="margin:0">نموذج واحد لكل برنامج (بلا مواعيد ولا محاضرين)، أساسٌ يُبنى منه «PIF التنفيذي» لكل دفعة أو سلسلة. كل فئة تُضاف تظهر هنا ببرامجها، ونسبة الاكتمال أمام كل فئة.</p></div>';
 if(!d.cats.length)h+='<div class="card empty">أضف الفئات والبرامج أولاً</div>';
 d.cats.forEach(function(c){
  h+='<div class="card bcat"><div class="bch"><h3>'+esc(c.name)+(c.code?' <span class="badge b-nav" dir="ltr">'+esc(c.code)+'</span>':'')+'</h3><span class="sp"></span><div class="bpct"><div class="rbar"><i style="width:'+c.pct+'%"></i></div><b>'+c.pct+'%</b> <span class="mute">اكتمال الفئة</span></div></div>'+
   (c.progs.length?'<div class="tw"><table class="t"><tr><th>رمز الأرشيف</th><th>البرنامج</th><th>رقم الاستمارة</th><th>الحالة</th><th></th></tr>'+c.progs.map(function(p){
    return '<tr><td dir="ltr" style="text-align:right"><b>'+esc(p.code)+'</b></td><td><b>'+esc(p.nameAr)+'</b><div class="mute" dir="ltr" style="text-align:right">'+esc(p.nameEn||'')+'</div></td><td dir="ltr" style="text-align:right">'+(p.base?esc(p.base.id):'—')+'</td><td>'+bsBadge(p.base)+(p.base?'<div class="mute">'+esc(p.base.updated||'')+'</div>':'')+'</td>'+
     '<td style="white-space:nowrap">'+(tm?'<a class="btn s'+(p.base?' l':'')+'" onclick="bpOpen(\''+esc(p.code)+'\')">'+(p.base?(p.base.status==='مكتمل'?'تعديل':'فتح'):'إنشاء')+'</a> ':'')+(p.base?'<a class="btn s l" onclick="bpView(\''+esc(p.code)+'\')">عرض / طباعة</a>':'')+'</td></tr>'}).join('')+'</table></div>':'<div class="mute" style="padding:6px 0">لا توجد برامج في هذه الفئة بعد</div>')+'</div>'});
 $('app').innerHTML=h}
function bpView(code){busy(true);run('api_baseView',[BOOT.k,code]).then(function(html){busy(false);$('app').innerHTML='<div class="card"><h2>PIF أساسي — '+esc(code)+'<span class="sp"></span><a class="btn s l" onclick="var f=document.getElementById(\'bpv\');f.contentWindow.print()">طباعة</a> <a class="btn s l" onclick="bpList()">→ رجوع</a></h2><iframe id="bpv" style="width:100%;height:78vh;border:1px solid var(--line);border-radius:8px;background:#fff"></iframe></div>';$('bpv').srcdoc=html}).catch(function(e){busy(false);toast(e.message)})}
function bpOpen(code){busy(true);run('api_baseGet',[BOOT.k,code]).then(function(d){busy(false);BD=d;bpForm()}).catch(function(e){busy(false);toast(e.message)})}
 
function bI(id,l,v,o){o=o||{};return '<div'+(o.w?' class="w2"':'')+'><label class="f">'+esc(l)+(o.req?' <i>*</i>':'')+'</label>'+(o.ta?'<textarea id="'+id+'" rows="'+(o.rows||4)+'" placeholder="'+esc(o.ph||'')+'">'+esc(v||'')+'</textarea>':o.sel?'<select id="'+id+'"><option value="">— اختر —</option>'+o.sel.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join('')+'</select>':'<input id="'+id+'" '+(o.t?'type="'+o.t+'" ':'')+(o.list?'list="'+o.list+'" ':'')+'value="'+esc(v==null?'':v)+'" placeholder="'+esc(o.ph||'')+'">')+(o.h?'<div class="mute" style="font-size:12px">'+o.h+'</div>':'')+'</div>'}
function bChips(id,opts,sel){sel=sel||[];return '<div class="chips3" id="'+id+'">'+opts.concat(sel.filter(function(s){return opts.indexOf(s)<0})).map(function(o){var on=sel.indexOf(o)>-1;return '<label class="'+(on?'on':'')+'"><input type="checkbox" value="'+esc(o)+'"'+(on?' checked':'')+' onchange="this.parentNode.className=this.checked?\'on\':\'\'">'+esc(o)+(opts.indexOf(o)<0?'<span class="x" title="إزالة" onclick="this.parentNode.remove()">×</span>':'')+'</label>'}).join('')+'</div>'}
function bAddRow(id,ph){return '<div class="addrow"><input id="'+id+'_new" placeholder="'+esc(ph)+'" onkeydown="if(event.key===\'Enter\'){event.preventDefault();bAddChip(\''+id+'\')}"><a class="btn l s" onclick="bAddChip(\''+id+'\')">إضافة</a></div>'}
function bAddChip(id){var i=$(id+'_new'),v=i.value.trim();if(!v)return;var box=$(id),ex=[].slice.call(box.querySelectorAll('input')).filter(function(x){return x.value===v})[0];
  if(ex){ex.checked=true;ex.parentNode.className='on'}else{var l=document.createElement('label');l.className='on';l.innerHTML='<input type="checkbox" checked value="'+esc(v)+'" onchange="this.parentNode.className=this.checked?\'on\':\'\'">'+esc(v)+'<span class="x" title="إزالة" onclick="this.parentNode.remove()">×</span>';box.appendChild(l)}i.value=''}
function bChipVals(id){return [].slice.call(document.querySelectorAll('#'+id+' input:checked')).map(function(x){return x.value})}
function bList(id,arr,ph){arr=arr&&arr.length?arr:[''];return '<div class="blist" id="'+id+'">'+arr.map(function(v){return bItem(v,ph)}).join('')+'</div><a class="btn s l" onclick="bAdd(\''+id+'\',\''+esc(ph||'')+'\')">+ إضافة</a>'}
function bItem(v,ph){return '<div class="bit"><input value="'+esc(v||'')+'" placeholder="'+esc(ph||'')+'"><button class="x" onclick="this.parentNode.remove()">×</button></div>'}
function bAdd(id,ph){var d=document.createElement('div');d.innerHTML=bItem('',ph);$(id).appendChild(d.firstChild)}
function bListVals(id){return [].slice.call(document.querySelectorAll('#'+id+' input')).map(function(i){return i.value.trim()}).filter(String)}
function bpForm(){var d=BD,pg=d.prog,A=(d.d||{}).A||{},B=(d.d||{}).B||{},r=A.req||{},mm={};(A.modes||[]).forEach(function(m){mm[m.mode]=m.hours});
 var h='<div class="card"><h2>'+(d.base?'نموذج المعلومات الأساسي — '+esc(d.base.id):'إنشاء نموذج المعلومات الأساسي')+'<span class="sp"></span>'+(d.base?bsBadge(d.base):'')+' <a class="btn s l" onclick="bpif()">→ كل البرامج</a></h2>'+
  '<div class="qp2"><div><span>اسم الدورة (عربي)</span><b>'+esc(pg.nameAr)+(pg.mcode?' '+esc(pg.mcode):'')+'</b></div><div dir="ltr"><span>Course name (En)</span><b>'+esc(pg.nameEn||'—')+'</b></div><div><span>الرمز التسويقي</span><b dir="ltr">'+esc(pg.mcode||'—')+'</b></div><div><span>رمز الأرشيف</span><b dir="ltr">'+esc(pg.code)+'</b></div><div><span>الفئة</span><b>'+esc(pg.cat||'')+'</b></div></div>'+
  (d.missing.length?'<div class="alert a-warn" style="margin-top:10px">لاكتمال النموذج: '+esc(d.missing.join('، '))+'</div>':'<div class="alert a-ok" style="margin-top:10px">✔ النموذج مكتمل</div>')+'</div>';
 h+='<div class="fsec"><h3>أ-1: معلومات عامة للبرنامج</h3><div class="fgrid">'+bI('b_ptype','حالة البرنامج',A.ptype||'برنامج جديد',{sel:['برنامج جديد','إعادة تقديم','برنامج محدَّث'],req:1})+bI('b_lang','اللغة',A.lang||'العربية',{sel:BLANGS,req:1})+
  bI('b_admin','المسؤول الإداري',A.admin,{req:1,list:'bLec'})+bI('b_sci','المنسق العلمي',A.sciCoord||pg.sup,{req:1,list:'bLec',h:'الافتراضي: المشرف العلمي للفئة'})+
  '<div class="w2"><label class="f">جهات الاعتماد الممكنة</label>'+bChips('b_acc',d.accOpts||[],A.accBodies||pg.acc||[])+bAddRow('b_acc','جهات أخرى…')+'</div></div></div>';
 h+='<div class="fsec"><h3>أ-2: معلومات التنفيذ للبرنامج</h3><div style="padding:12px 14px"><label class="f">نمط التقديم المفضل <i>*</i> <span class="mute">— يمكن اختيار أكثر من نمط، ولكل نمط عدد ساعات مقترح</span></label><div class="bmodes">'+
  d.modes.map(function(m,i){var on=mm[m]!==undefined;return '<div class="bmode'+(on?' on':'')+'"><label><input type="checkbox" data-mode="'+esc(m)+'"'+(on?' checked':'')+' onchange="this.closest(\'.bmode\').classList.toggle(\'on\',this.checked)"> '+esc(m)+'</label><input type="number" min="0" step="0.5" data-mh="'+esc(m)+'" value="'+esc(on?mm[m]:'')+'" placeholder="عدد الساعات المقترحة"></div>'}).join('')+'</div>'+
  '<div class="fgrid" style="padding:12px 0 0">'+bI('b_th','نسبة النظري (%)',A.theory,{t:'number'})+bI('b_pr','نسبة العملي (%)',A.practice,{t:'number',h:'مجموع النسبتين 100%'})+'</div></div></div>';
 h+='<div class="fsec"><h3>أ-3: الفئة المستهدفة وشروط الالتحاق</h3><div style="padding:12px 14px"><label class="f">الفئات المستهدفة <i>*</i></label>'+bChips('b_aud',BAUD,A.audience)+bAddRow('b_aud','فئة أخرى…')+
  '<div class="fgrid" style="padding:10px 0 0"><div class="w2"><label class="f">شروط الالتحاق (المؤهلات / الخبرات)</label>'+bList('b_pre',A.prereq,'مثال: بكالوريوس في تخصص صحي')+'</div>'+bI('b_min','الحد الأدنى لعدد المتدربين',A.minN,{t:'number'})+bI('b_max','الحد الأقصى لعدد المتدربين',A.maxN,{t:'number'})+'</div></div></div>';
 h+='<div class="fsec"><h3>أ-4: الحد الأدنى من متطلبات المدرب</h3><div class="fgrid">'+bI('b_deg','الدرجة العلمية',r.degree||r.qual,{sel:BDEG,req:1})+bI('b_spec','التخصص / المجال المهني',r.spec,{sel:BSPEC,req:1})+bI('b_exp','الخبرة المهنية',r.exp,{sel:BYEARS})+bI('b_th2','ساعات تم تدريبها',r.thours,{t:'number'})+bI('b_rlang','لغة تقديم البرنامج',r.lang,{sel:BLANGS})+
  '<div class="w2"><label class="f">متطلبات الاعتماد والتأهيل</label>'+bChips('b_creds',BCREDS,r.creds)+bAddRow('b_creds','متطلب آخر…')+'</div>'+bI('b_oth','متطلبات أخرى',r.other,{ta:1,w:1,rows:2})+'</div></div>';
 h+='<div class="fsec"><h3>الرسالة التسويقية <small>تُعبّأ تلقائياً في «تنفيذ البرنامج» ويمكن تعديلها هناك</small></h3><div style="padding:12px 14px">'+bI('b_msg','الرسالة التسويقية',BD.d.msg||'',{ta:1,rows:4,ph:'مثال: ارتقِ بممارستك واستعد للاختبار بثقة مع نخبة من الخبراء.'})+'</div></div>';
 h+='<div class="fsec"><h3>ب-1: أهداف البرنامج ومخرجاته</h3><div style="padding:12px 14px">'+bI('b_goal','الهدف العام (Overall Aim)',B.goal,{ta:1,req:1})+'<div class="lead3">بنهاية البرنامج يكون المتدرب قد استوفى المخرجات التالية:</div>'+
  '<label class="f sh3">مخرجات التعلم المستهدفة (ILOs)</label>'+bList('b_out',B.outcomes,'يطبّق …')+'<label class="f sh3">المخرجات القابلة للقياس</label>'+bList('b_mout',B.mOutcomes,'يؤدي … وفق … بنسبة …')+'</div></div>';
 h+='<div class="fsec"><h3>ب-2: المحاور الرئيسية للحقيبة التدريبية</h3><div style="padding:12px 14px"><div id="b_ol">'+((B.outline&&B.outline.length?B.outline:[{},{}]).map(bUnit).join(''))+'</div><a class="btn s l" onclick="var d=document.createElement(\'div\');d.innerHTML=bUnit({});$(\'b_ol\').appendChild(d.firstChild)">+ إضافة وحدة</a></div></div>';

 h+='<div class="fsec"><h3>ب-5: آلية التقييم</h3><div style="padding:12px 14px">'+bChips('b_eval',BEVAL,B.evalMethods)+'<div class="fgrid" style="padding:10px 0 0">'+bI('b_evo','أخرى',B.evalOther,{})+'</div></div></div>';

<script>
 
(function(){try{
  var ua=navigator.userAgent||'',mob=/Android|iPhone|iPad|iPod/i.test(ua)||document.documentElement.classList.contains('mob');
